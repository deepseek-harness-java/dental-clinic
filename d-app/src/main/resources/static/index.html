<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 牙科诊所助手台 · Dental Clinic</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#f4f7f6; color:#1f2d2a; }
  header { background:linear-gradient(135deg,#123f38,#2e8b74); color:#fff; padding:18px 28px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:20px; }
  header .sub { font-size:12px; opacity:.85; margin-top:4px; }
  header .badge { font-size:13px; background:rgba(255,255,255,.15); padding:6px 14px; border-radius:20px; }
  main { display:grid; grid-template-columns:1fr 340px; gap:16px; padding:16px 20px; max-width:1240px; margin:0 auto; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .card { background:#fff; border-radius:12px; padding:16px 18px; box-shadow:0 1px 4px rgba(18,63,56,.08); }
  .card h2 { font-size:15px; margin-bottom:12px; color:#123f38; }
  .stat { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .stat div { background:#e9f4f0; border-radius:10px; padding:12px; }
  .stat b { display:block; font-size:22px; color:#1f7a63; margin-top:4px; }
  .stat span { font-size:12px; color:#6d837e; }
  .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; }
  .tag.g { background:#e3f4e9; color:#218a58; }
  .tag.y { background:#fdf3e0; color:#c07f16; }
  .tag.r { background:#fdeaea; color:#c74a44; }
  .tag.b { background:#e7f0fb; color:#2e5fa3; }
  .it { border:1px solid #dfe8e5; border-radius:10px; padding:10px 14px; margin-bottom:10px; }
  .it .top { display:flex; justify-content:space-between; margin-bottom:4px; }
  .it b { color:#123f38; font-size:13.5px; }
  .it .meta { font-size:12.5px; color:#54685f; line-height:1.7; }
  .bar { height:8px; background:#dfe8e5; border-radius:4px; overflow:hidden; margin-top:6px; }
  .bar i { display:block; height:100%; background:#2e8b74; }
  .bar i.full { background:#c74a44; }
  .ai-panel { position:sticky; top:16px; display:flex; flex-direction:column; height:calc(100vh - 32px); background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 4px rgba(18,63,56,.08); }
  .ai-head { background:linear-gradient(135deg,#123f38,#2e8b74); color:#fff; padding:14px 16px; }
  .ai-head b { font-size:15px; }
  .ai-head .sub { font-size:11px; opacity:.85; margin-top:3px; }
  .ai-body { flex:1; overflow-y:auto; padding:14px; font-size:13.5px; line-height:1.75; }
  .ai-body .msg { margin-bottom:12px; white-space:pre-wrap; word-break:break-word; }
  .ai-body .msg.user { background:#e9f4f0; border-radius:10px 10px 2px 10px; padding:8px 12px; margin-left:24px; color:#1f2d2a; }
  .chips { padding:8px 14px; display:flex; flex-wrap:wrap; gap:6px; border-top:1px solid #eef3f1; }
  .chip { font-size:12px; background:#e9f4f0; color:#123f38; border:none; border-radius:14px; padding:5px 10px; cursor:pointer; }
  .chip:hover { background:#d8eae3; }
  .ai-input { display:flex; gap:8px; padding:10px 14px; border-top:1px solid #eef3f1; }
  .ai-input input { flex:1; border:1px solid #ccd9d4; border-radius:8px; padding:9px 12px; font-size:13px; outline:none; }
  .ai-input input:focus { border-color:#2e8b74; }
  .ai-input button { background:#2e8b74; color:#fff; border:none; border-radius:8px; padding:0 18px; font-size:13px; cursor:pointer; }
  .ai-input button:disabled { background:#a3c6bc; }
</style>
</head>
<body>
<header>
  <div>
    <h1>🦷 AI 牙科诊所助手台</h1>
    <div class="sub">医生排班 · 挂号 · 就诊记录 · 医保估算 | 牙科诊所云平台</div>
  </div>
  <div class="badge" id="topBadge">加载中…</div>
</header>
<main>
  <div class="col">
    <div class="card">
      <h2>运营看板</h2>
      <div class="stat" id="stats"></div>
    </div>
    <div class="card">
      <h2>医生排班</h2>
      <div id="doctors"></div>
    </div>
    <div class="card">
      <h2>今日挂号</h2>
      <div id="appts"></div>
    </div>
  </div>
  <div class="ai-panel">
    <div class="ai-head">
      <b>🦷 AI 牙科助手</b>
      <div class="sub">dental-copilot · 排班 / 挂号 / 记录 / 医保</div>
    </div>
    <div class="ai-body" id="aiBody"></div>
    <div class="chips">
      <button class="chip" onclick="ask('明天有哪些医生出诊？还有号吗？')">医生排班</button>
      <button class="chip" onclick="ask('帮我看看陈国栋的就诊记录')">就诊记录</button>
      <button class="chip" onclick="ask('赵小虎补一颗乳牙，医保能报多少？')">费用估算</button>
      <button class="chip" onclick="ask('今天诊所运营情况怎么样？')">运营看板</button>
    </div>
    <div class="ai-input">
      <input id="q" placeholder="例如：洁牙多少钱？帮我给刘桂芳约林晓芸复诊" onkeydown="if(event.key==='Enter')send()">
      <button id="sendBtn" onclick="send()">发送</button>
    </div>
  </div>
</main>
<script>
const j = r => Promise.resolve(r).then(resp => resp.json()).then(d => d.data ?? d);
const dTag = s => s==='出诊' ? '<span class="tag g">出诊</span>' : '<span class="tag r">停诊</span>';
const aTag = s => s==='已预约' ? '<span class="tag y">已预约</span>' : s==='已完成' ? '<span class="tag g">已完成</span>' : '<span class="tag b">已取消</span>';
async function load() {
  try {
    const st = await j(fetch('/api/stats'));
    document.getElementById('topBadge').textContent = `医生 ${st.doctors} · 出诊 ${st.onDuty}`;
    document.getElementById('stats').innerHTML = `
      <div><span>出诊医生</span><b>${st.onDuty}/${st.doctors}</b></div>
      <div><span>待就诊</span><b>${st.pendingAppts}</b></div>
      <div><span>建档患者</span><b>${st.patients}</b></div>
      <div><span>跟进建议</span><b style="font-size:12px;line-height:1.5;color:#54685f">${st.advice}</b></div>`;
    const ds = await j(fetch('/api/doctors'));
    document.getElementById('doctors').innerHTML = ds.map(c => {
      const rate = Math.round(c.booked*100/c.capacity);
      return `<div class="it">
        <div class="top"><b>${c.id} · ${c.name} ${c.title}</b>${dTag(c.status)}<span class="${rate>=100?'tag r':rate>=70?'tag y':'tag g'}">${c.booked}/${c.capacity}</span></div>
        <div class="meta">${c.specialty} · ${c.slot} · 挂号费 ¥${c.fee}</div>
        <div class="bar"><i class="${rate>=100?'full':''}" style="width:${rate}%"></i></div>
      </div>`;
    }).join('');
    const as = await j(fetch('/api/appts'));
    document.getElementById('appts').innerHTML = as.map(x => `
      <div class="it">
        <div class="top"><b>${x.id} · ${x.patient}</b>${aTag(x.status)}</div>
        <div class="meta">${x.doctor} · ${x.time} · ${x.item}</div>
      </div>`).join('');
  } catch(e) { console.error(e); }
}
function ask(t) { const q=document.getElementById('q'); q.value=t; send(); }
async function send() {
  const inp = document.getElementById('q'), btn = document.getElementById('sendBtn');
  const text = inp.value.trim(); if (!text || btn.disabled) return;
  inp.value = ''; btn.disabled = true;
  const body = document.getElementById('aiBody');
  const u = document.createElement('div'); u.className = 'msg user'; u.textContent = text; body.appendChild(u);
  const a = document.createElement('div'); a.className = 'msg'; a.textContent = '…'; body.appendChild(a);
  try {
    const resp = await fetch('/api/assistant/stream', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message:text}) });
    const reader = resp.body.getReader(), dec = new TextDecoder(); let buf = '', out = '';
    for (;;) {
      const {done, value} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const p of parts) {
        for (const line of p.split('\n')) {
          if (!line.startsWith('data:')) continue;
          const dstr = line.slice(5).trim(); if (!dstr || dstr === '[DONE]') continue;
          try {
            const d = JSON.parse(dstr);
            const piece = d.content ?? d.delta ?? '';
            if (typeof piece === 'string' && piece) { out += piece; a.textContent = out; body.scrollTop = body.scrollHeight; }
          } catch(e) {}
        }
      }
    }
    if (!out) a.textContent = '（无返回内容）';
  } catch(e) { a.textContent = 'AI 服务暂时不可用：' + e.message; }
  btn.disabled = false; body.scrollTop = body.scrollHeight;
}
load();
</script>
</body>
</html>
